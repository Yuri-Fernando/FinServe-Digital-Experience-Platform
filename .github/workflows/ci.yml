name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar dependências
        run: python -m pip install "fastapi>=0.110,<1" "uvicorn>=0.27,<1" "pydantic>=2.5,<3" "PyYAML>=6" "pytest>=8" "httpx>=0.27"
      - name: Validar specs de dashboard e regras de compliance
        run: python -m finserve check
      - name: Testes (sem rede — o cliente do BCB usa fetch injetado)
        run: python -m pytest

  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Checar sintaxe dos módulos JS (sem bundler)
        run: |
          mkdir -p /tmp/jscheck
          for f in $(find web/assets -name '*.js'); do
            cp "$f" "/tmp/jscheck/$(echo "$f" | tr '/' '_' | sed 's/\.js$/.mjs/')"
          done
          for f in /tmp/jscheck/*.mjs; do node --check "$f" && echo "ok $f"; done
